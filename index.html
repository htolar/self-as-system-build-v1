<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Canvas Sketch — Single Blob</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #08080d;
    font-family: Arial, sans-serif;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: grab;
  }
  canvas:active {
    cursor: grabbing;
  }
  .ui-overlay {
    position: absolute;
    top: 16px;
    left: 16px;
    color: #cfe;
    background: rgba(11, 16, 18, 0.7);
    padding: 12px 16px;
    border-radius: 8px;
    border: 1px solid rgba(170, 255, 245, 0.22);
    pointer-events: none;
    font-size: 14px;
    line-height: 1.4;
  }
</style>
</head>
<body>

<div class="ui-overlay">
  <strong>Single Blob Interactive</strong><br>
  • Click &amp; drag the blob to throw it<br>
  • Hover cursor to deform edges<br>
  • Press <strong>Space</strong> to split into two<br>
  • Gravity &amp; wall bounces active
</div>

<canvas id="canvas"></canvas>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0, blobs = [], splitting = false, splitTime = 0;
  const gravity = 0.18, bounce = 0.55;

  const mouse = { x: -1000, y: -1000 };
  let draggedBlob = null, grabOffsetX = 0, grabOffsetY = 0;

  canvas.addEventListener('pointerdown', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    for (let i = blobs.length - 1; i >= 0; i--) {
      const b = blobs[i];
      const dx = mouse.x - b.x;
      const dy = mouse.y - b.y;
      if ((dx * dx) / ((b.w / 2) ** 2) + (dy * dy) / ((b.h / 2) ** 2) < 1) {
        draggedBlob = b;
        grabOffsetX = dx;
        grabOffsetY = dy;
        blobs.splice(i, 1);
        blobs.push(b);
        break;
      }
    }
  });

  canvas.addEventListener('pointermove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  window.addEventListener('pointerup', () => {
    if (draggedBlob) {
      draggedBlob.vx *= 1.2;
      draggedBlob.vy *= 1.2;
      draggedBlob = null;
    }
  });

  function resize() {
    W = canvas.width = Math.max(1, innerWidth);
    H = canvas.height = Math.max(1, innerHeight);
    if (blobs.length === 0) makeSingleBlob();
  }
  addEventListener('resize', resize);

  function makeBlob(x, y, scale = 1.5) {
    const n = 36;
    return {
      x, y, vx: 0, vy: 0,
      w: 82 * scale * (0.9 + Math.random() * 0.2),
      h: 42 * scale * (0.9 + Math.random() * 0.2),
      rot: (Math.random() - 0.5) * 0.15,
      n,
      shape: Array.from({ length: n }, () => 0.94 + Math.random() * 0.12),
      deformation: Array(n).fill(0),
      deformationVelocity: Array(n).fill(0)
    };
  }

  function makeSingleBlob() {
    blobs = [makeBlob(W / 2, H / 3, 1.8)];
  }

  function drawBlob(b) {
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.rot);
    ctx.beginPath();
    for (let i = 0; i <= b.n; i++) {
      const j = i % b.n;
      const a = j / b.n * Math.PI * 2;
      const s = b.shape[j];
      const def = b.deformation[j];
      const x = Math.cos(a) * (b.w / 2) * s + Math.cos(a) * def;
      const y = Math.sin(a) * (b.h / 2) * s + Math.sin(a) * def;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = 'rgba(100,220,210,0.25)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(170,255,245,0.5)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();
  }

  function drawDividingBlob(b, progress) {
    const p = progress * progress * (3 - 2 * progress);
    const length = b.w * (1 + 0.58 * p);
    const height = b.h * (1 - 0.05 * p);
    const pinch = Math.max(0.001, 1 - p);

    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.splitAngle);
    ctx.beginPath();
    const n = 72;
    for (let i = 0; i <= n; i++) {
      const a = i / n * Math.PI * 2;
      const c = Math.cos(a);
      const si = Math.sin(a);
      const shape = b.shape[Math.floor((i % n) / n * b.n)];
      const centerFactor = Math.pow(Math.abs(c), 0.62);
      const middlePinch = pinch + (1 - pinch) * centerFactor;
      const x = c * length / 2 * shape;
      const y = si * height / 2 * middlePinch * shape;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = 'rgba(100,220,210,0.25)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(170,255,245,0.5)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();
  }

  function startSplit() {
    if (splitting) return;
    splitting = true;
    splitTime = 0;
    blobs.forEach(b => { b.splitAngle = b.rot; });
  }

  addEventListener('keydown', e => {
    if (e.code === 'Space') {
      e.preventDefault();
      startSplit();
    }
  });

  function updateSplit(dt) {
    splitTime += dt;
    const raw = Math.min(splitTime / 1500, 1);
    const p = raw * raw * (3 - 2 * raw);

    for (const b of blobs) drawDividingBlob(b, p);

    if (raw >= 1) {
      const newBlobs = [];
      for (const b of blobs) {
        const distance = b.w * 1.58 * 0.28;
        const left = makeBlob(b.x - Math.cos(b.splitAngle) * distance, b.y - Math.sin(b.splitAngle) * distance, b.w / 120);
        const right = makeBlob(b.x + Math.cos(b.splitAngle) * distance, b.y + Math.sin(b.splitAngle) * distance, b.w / 120);
        left.shape = [...b.shape];
        right.shape = [...b.shape];
        left.rot = right.rot = b.splitAngle;
        left.vx = -Math.cos(b.splitAngle) * 0.3;
        left.vy = -Math.sin(b.splitAngle) * 0.3;
        right.vx = Math.cos(b.splitAngle) * 0.3;
        right.vy = Math.sin(b.splitAngle) * 0.3;
        newBlobs.push(left, right);
      }
      blobs = newBlobs;
      splitting = false;
    }
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(now - last, 32);
    last = now;
    ctx.clearRect(0, 0, W, H);

    if (splitting) {
      updateSplit(dt);
    } else {
      for (const b of blobs) {
        if (b === draggedBlob) {
          b.x = mouse.x - grabOffsetX;
          b.y = mouse.y - grabOffsetY;
          b.vx *= 0.8;
          b.vy *= 0.8;
        } else {
          b.vy += gravity;
          b.vx *= 0.995;
          b.vy *= 0.995;
          b.x += b.vx;
          b.y += b.vy;

          const bottom = H - b.h / 2;
          if (b.y > bottom) {
            b.y = bottom;
            b.vy *= -bounce;
            b.vx *= 0.88;
            if (Math.abs(b.vy) < 0.5) b.vy = 0;
          }
          const left = b.w / 2, right = W - b.w / 2;
          if (b.x < left) { b.x = left; b.vx *= -bounce; }
          if (b.x > right) { b.x = right; b.vx *= -bounce; }
        }

        for (let i = 0; i < b.n; i++) {
          const a = (i / b.n) * Math.PI * 2;
          const baseX = b.x + Math.cos(a + b.rot) * (b.w / 2);
          const baseY = b.y + Math.sin(a + b.rot) * (b.h / 2);
          const dx = mouse.x - baseX, dy = mouse.y - baseY;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < 35) {
            b.deformation[i] += (1 - dist / 35) * 8;
          }

          const movement = b.vx * Math.cos(a) + b.vy * Math.sin(a);
          b.deformationVelocity[i] -= movement * 0.25 + b.deformation[i] * 0.08;
          b.deformationVelocity[i] *= 0.86;
          b.deformation[i] += b.deformationVelocity[i];
        }

        drawBlob(b);
      }
    }
    requestAnimationFrame(loop);
  }

  resize();
  requestAnimationFrame(loop);
</script>
</body>
</html>

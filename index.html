<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Interactive Blobs</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #08080d;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  cursor: grab;
}

canvas:active {
  cursor: grabbing;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>
"use strict";


/* ============================================================
   CANVAS
============================================================ */

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

let W = 0;
let H = 0;

let blobs = [];

const bounce = 0.75;


/* ============================================================
   UNLIMITED ZOOM
============================================================ */

/*
   There is intentionally NO minimum or maximum zoom.

   Press 1 = zoom in
   Press 2 = zoom out

   You can keep doing either one forever.
*/

let cameraScale = 1;


/* ============================================================
   INTERACTION
============================================================ */

const INTERACTION_RADIUS = 45;

const COLOR_HOLD_TIME = 1000;

const COLOR_FADE_TIME = 500;


/* ============================================================
   MOUSE
============================================================ */

const mouse = {
  x: -1000,
  y: -1000,

  px: -1000,
  py: -1000,

  vx: 0,
  vy: 0
};

let draggedBlob = null;

let grabOffsetX = 0;
let grabOffsetY = 0;


/* ============================================================
   SCREEN -> WORLD
============================================================ */

function screenToWorld(
  screenX,
  screenY
) {

  const cx =
    W / 2;

  const cy =
    H / 2;

  return {

    x:
      (screenX - cx) /
      cameraScale +
      cx,

    y:
      (screenY - cy) /
      cameraScale +
      cy
  };
}


/* ============================================================
   UNLIMITED ZOOM IN
============================================================ */

function zoomIn() {

  /*
     No maximum.

     Exponential zoom keeps it smooth
     while allowing extremely large values.
  */

  cameraScale *= 1.25;
}


/* ============================================================
   UNLIMITED ZOOM OUT
============================================================ */

function zoomOut() {

  /*
     No minimum.

     Prevent the scale from becoming exactly
     zero because that would break division.
  */

  cameraScale /= 1.25;

  if (
    cameraScale < 0.000000000001
  ) {

    cameraScale =
      0.000000000001;
  }
}


/* ============================================================
   POINTER DOWN
============================================================ */

canvas.addEventListener(
  "pointerdown",
  e => {

    const p =
      screenToWorld(
        e.clientX,
        e.clientY
      );

    mouse.x =
      p.x;

    mouse.y =
      p.y;

    mouse.px =
      p.x;

    mouse.py =
      p.y;

    mouse.vx = 0;
    mouse.vy = 0;


    for (
      let i =
        blobs.length - 1;

      i >= 0;

      i--
    ) {

      const b =
        blobs[i];


      const rx =
        Math.max(
          b.w / 2,
          1
        );


      const ry =
        Math.max(
          b.h / 2,
          1
        );


      const dx =
        mouse.x -
        b.x;


      const dy =
        mouse.y -
        b.y;


      if (
        (dx * dx) /
          (rx * rx) +

        (dy * dy) /
          (ry * ry)

        <= 1
      ) {

        draggedBlob =
          b;

        grabOffsetX =
          dx;

        grabOffsetY =
          dy;


        blobs.splice(
          i,
          1
        );

        blobs.push(b);

        break;
      }
    }
  }
);


/* ============================================================
   POINTER MOVE
============================================================ */

canvas.addEventListener(
  "pointermove",
  e => {

    const p =
      screenToWorld(
        e.clientX,
        e.clientY
      );

    mouse.x =
      p.x;

    mouse.y =
      p.y;
  }
);


/* ============================================================
   POINTER LEAVE
============================================================ */

canvas.addEventListener(
  "pointerleave",
  () => {

    mouse.x =
      -1000;

    mouse.y =
      -1000;
  }
);


/* ============================================================
   POINTER UP
============================================================ */

window.addEventListener(
  "pointerup",
  () => {

    if (
      draggedBlob
    ) {

      draggedBlob.vx =
        mouse.vx * 0.8;

      draggedBlob.vy =
        mouse.vy * 0.8;

      draggedBlob =
        null;
    }
  }
);


/* ============================================================
   RESIZE
============================================================ */

function resize() {

  W =
    canvas.width =
      Math.max(
        1,
        innerWidth
      );

  H =
    canvas.height =
      Math.max(
        1,
        innerHeight
      );


  if (
    blobs.length === 0
  ) {

    makeSingleBlob();
  }
}

addEventListener(
  "resize",
  resize
);


/* ============================================================
   RANDOM COLOR
============================================================ */

function randomColor() {

  const h =
    Math.random() *
    360;

  const s =
    75 +
    Math.random() *
    25;

  const l =
    50 +
    Math.random() *
    10;


  return hslToRgb(
    h,
    s,
    l
  );
}


function hslToRgb(
  h,
  s,
  l
) {

  s /= 100;
  l /= 100;


  const k =
    n =>
      (n + h / 30) % 12;


  const a =
    s *
    Math.min(
      l,
      1 - l
    );


  const f =
    n =>
      l -
      a *
      Math.max(
        -1,
        Math.min(
          k(n) - 3,

          Math.min(
            9 - k(n),
            1
          )
        )
      );


  return {

    r:
      Math.round(
        255 * f(0)
      ),

    g:
      Math.round(
        255 * f(8)
      ),

    b:
      Math.round(
        255 * f(4)
      )
  };
}


/* ============================================================
   CREATE BLOB
============================================================ */

function makeBlob(
  x,
  y,
  scale = 1.5
) {

  const n = 36;


  return {

    x,
    y,

    vx: 0,
    vy: 0,


    w:
      Math.max(
        0.75,
        82 * scale
      ),


    h:
      Math.max(
        0.38,
        42 * scale
      ),


    rot:
      (Math.random() - 0.5) *
      0.15,


    n,


    shape:
      Array.from(
        {
          length: n
        },

        () =>
          0.94 +
          Math.random() *
          0.12
      ),


    deformation:
      Array(n).fill(0),


    deformationVelocity:
      Array(n).fill(0),


    splitting:
      false,


    splitTime:
      0,


    splitAngle:
      0,


    isInteracting:
      false,


    colorTimer:
      0,


    colorFade:
      0,


    hoverColor:
      randomColor()
  };
}


/* ============================================================
   INITIAL BLOB
============================================================ */

function makeSingleBlob() {

  blobs = [

    makeBlob(
      W / 2,
      H / 2,
      1.8
    )

  ];
}


/* ============================================================
   SPLITTING
============================================================ */

function startSplit() {

  for (
    const b of blobs
  ) {

    if (
      !b.splitting
    ) {

      b.splitting =
        true;

      b.splitTime =
        0;

      b.splitAngle =
        b.rot;
    }
  }
}


/* ============================================================
   KEYBOARD
============================================================ */

addEventListener(
  "keydown",
  e => {

    if (
      e.code === "Space"
    ) {

      e.preventDefault();

      startSplit();

    } else if (
      e.key === "1"
    ) {

      zoomIn();

    } else if (
      e.key === "2"
    ) {

      zoomOut();
    }
  }
);


/* ============================================================
   INTERACTION / COLOR
============================================================ */

function updateInteraction(
  b,
  dt
) {

  const dx =
    mouse.x -
    b.x;


  const dy =
    mouse.y -
    b.y;


  /*
     Keep the interaction area at the
     original 45px behavior.

     This remains useful even when blobs
     become incredibly tiny.
  */

  const distance =
    Math.sqrt(
      dx * dx +
      dy * dy
    );


  const inside =
    distance <=
    INTERACTION_RADIUS;


  /* ----------------------------------------------------------
     NEW INTERACTION
  ---------------------------------------------------------- */

  if (
    inside &&
    !b.isInteracting
  ) {

    b.isInteracting =
      true;


    /*
       New random color every time
       the cursor enters.
    */

    b.hoverColor =
      randomColor();


    /*
       Instant color.
    */

    b.colorFade =
      1;


    /*
       Hold for one second.
    */

    b.colorTimer =
      COLOR_HOLD_TIME;

  } else if (
    !inside
  ) {

    b.isInteracting =
      false;
  }


  /* ----------------------------------------------------------
     COLOR TIMER
  ---------------------------------------------------------- */

  if (
    b.colorTimer > 0
  ) {

    b.colorTimer -=
      dt;


    if (
      b.colorTimer <= 0
    ) {

      b.colorTimer =
        0;
    }
  }


  /* ----------------------------------------------------------
     FADE
  ---------------------------------------------------------- */

  if (
    b.colorTimer > 0
  ) {

    b.colorFade =
      1;

  } else if (
    b.colorFade > 0
  ) {

    b.colorFade -=
      dt /
      COLOR_FADE_TIME;


    b.colorFade =
      Math.max(
        0,
        b.colorFade
      );
  }
}


/* ============================================================
   FILL COLOR
============================================================ */

function blobFillColor(b) {

  const baseR = 100;
  const baseG = 220;
  const baseB = 210;


  const c =
    b.hoverColor;


  const amount =
    b.colorFade;


  const r =
    Math.round(
      baseR +
      (c.r - baseR) *
      amount
    );


  const g =
    Math.round(
      baseG +
      (c.g - baseG) *
      amount
    );


  const blue =
    Math.round(
      baseB +
      (c.b - baseB) *
      amount
    );


  return (
    `rgba(${r},${g},${blue},0.25)`
  );
}


/* ============================================================
   STROKE COLOR
============================================================ */

function blobStrokeColor(b) {

  const baseR = 170;
  const baseG = 255;
  const baseB = 245;


  const c =
    b.hoverColor;


  const amount =
    b.colorFade;


  const r =
    Math.round(
      baseR +
      (c.r - baseR) *
      amount
    );


  const g =
    Math.round(
      baseG +
      (c.g - baseG) *
      amount
    );


  const blue =
    Math.round(
      baseB +
      (c.b - baseB) *
      amount
    );


  return (
    `rgba(${r},${g},${blue},0.5)`
  );
}


/* ============================================================
   SOFT COLLISIONS
============================================================ */

function resolveSoftCollisions() {

  for (
    let i = 0;
    i < blobs.length;
    i++
  ) {

    for (
      let j = i + 1;
      j < blobs.length;
      j++
    ) {

      const b1 =
        blobs[i];


      const b2 =
        blobs[j];


      const dx =
        b2.x -
        b1.x;


      const dy =
        b2.y -
        b1.y;


      const dist =
        Math.sqrt(
          dx * dx +
          dy * dy
        );


      const r1 =
        Math.max(
          (b1.w + b1.h) / 4,
          1
        );


      const r2 =
        Math.max(
          (b2.w + b2.h) / 4,
          1
        );


      const minDist =
        r1 +
        r2;


      if (
        dist < minDist &&
        dist > 0
      ) {

        const overlap =
          minDist -
          dist;


        const nx =
          dx /
          dist;


        const ny =
          dy /
          dist;


        const repulsionForce =
          overlap *
          0.08;


        if (
          b1 !== draggedBlob
        ) {

          b1.vx -=
            nx *
            repulsionForce;

          b1.vy -=
            ny *
            repulsionForce;

          b1.x -=
            nx *
            overlap *
            0.15;

          b1.y -=
            ny *
            overlap *
            0.15;
        }


        if (
          b2 !== draggedBlob
        ) {

          b2.vx +=
            nx *
            repulsionForce;

          b2.vy +=
            ny *
            repulsionForce;

          b2.x +=
            nx *
            overlap *
            0.15;

          b2.y +=
            ny *
            overlap *
            0.15;
        }


        deformOnCollision(
          b1,
          nx,
          ny,
          overlap
        );


        deformOnCollision(
          b2,
          -nx,
          -ny,
          overlap
        );
      }
    }
  }
}


/* ============================================================
   COLLISION DEFORMATION
============================================================ */

function deformOnCollision(
  b,
  nx,
  ny,
  overlap
) {

  const angleToImpact =
    Math.atan2(
      ny,
      nx
    ) -
    b.rot;


  for (
    let i = 0;
    i < b.n;
    i++
  ) {

    const a =
      (i / b.n) *
      Math.PI *
      2;


    let diff =
      Math.abs(
        a -
        angleToImpact
      );


    while (
      diff > Math.PI
    ) {

      diff -=
        Math.PI *
        2;
    }


    diff =
      Math.abs(
        diff
      );


    if (
      diff <
      Math.PI / 2
    ) {

      const factor =
        Math.cos(
          diff
        );


      b.deformationVelocity[i] -=
        overlap *
        factor *
        0.08;
    }
  }
}


/* ============================================================
   DRAW BLOB
============================================================ */

function drawBlobShape(
  b,
  dt
) {

  updateInteraction(
    b,
    dt
  );


  /* ==========================================================
     SPLITTING
  ========================================================== */

  if (
    b.splitting
  ) {

    b.splitTime +=
      dt;


    const raw =
      Math.min(
        b.splitTime / 1500,
        1
      );


    const p =
      raw *
      raw *
      (3 - 2 * raw);


    /* --------------------------------------------------------
       SPLIT COMPLETE
    -------------------------------------------------------- */

    if (
      raw >= 1
    ) {

      const distance =
        Math.max(
          b.w * 0.44,
          1
        );


      const childScale =
        Math.max(
          0.009,
          (b.w / 82) *
          0.7
        );


      const left =
        makeBlob(

          b.x -
            Math.cos(
              b.splitAngle
            ) *
            distance,

          b.y -
            Math.sin(
              b.splitAngle
            ) *
            distance,

          childScale
        );


      const right =
        makeBlob(

          b.x +
            Math.cos(
              b.splitAngle
            ) *
            distance,

          b.y +
            Math.sin(
              b.splitAngle
            ) *
            distance,

          childScale
        );


      left.shape =
        [...b.shape];


      right.shape =
        [...b.shape];


      left.rot =
        b.splitAngle;


      right.rot =
        b.splitAngle;


      left.vx =
        b.vx -
        Math.cos(
          b.splitAngle
        ) *
        2;


      left.vy =
        b.vy -
        Math.sin(
          b.splitAngle
        ) *
        2;


      right.vx =
        b.vx +
        Math.cos(
          b.splitAngle
        ) *
        2;


      right.vy =
        b.vy +
        Math.sin(
          b.splitAngle
        ) *
        2;


      /*
         Each child gets completely
         independent color state.
      */

      left.isInteracting =
        false;

      right.isInteracting =
        false;


      left.colorTimer =
        0;

      right.colorTimer =
        0;


      left.colorFade =
        0;

      right.colorFade =
        0;


      left.hoverColor =
        randomColor();

      right.hoverColor =
        randomColor();


      const idx =
        blobs.indexOf(b);


      if (
        idx !== -1
      ) {

        blobs.splice(
          idx,
          1,
          left,
          right
        );


        if (
          draggedBlob === b
        ) {

          draggedBlob =
            right;
        }
      }


      return;
    }


    /* --------------------------------------------------------
       SPLIT ANIMATION
    -------------------------------------------------------- */

    const length =
      b.w *
      (1 + 0.58 * p);


    const height =
      b.h *
      (1 - 0.05 * p);


    const pinch =
      Math.max(
        0.001,
        1 - p
      );


    ctx.save();


    ctx.translate(
      b.x,
      b.y
    );


    ctx.rotate(
      b.splitAngle
    );


    ctx.beginPath();


    const n = 96;


    for (
      let i = 0;
      i <= n;
      i++
    ) {

      const a =
        (i / n) *
        Math.PI *
        2;


      const c =
        Math.cos(a);


      const si =
        Math.sin(a);


      const shape =
        b.shape[
          Math.floor(
            (i % n) /
            n *
            b.n
          )
        ];


      const centerFactor =
        Math.pow(
          Math.abs(c),
          0.62
        );


      const middlePinch =
        pinch +
        (1 - pinch) *
        centerFactor;


      const blobIdx =
        Math.floor(
          (i % n) /
          n *
          b.n
        );


      const def =
        b.deformation[
          blobIdx
        ] || 0;


      const x =
        c *
        length /
        2 *
        shape +
        c *
        def;


      const y =
        si *
        height /
        2 *
        middlePinch *
        shape +
        si *
        def;


      if (
        i === 0
      ) {

        ctx.moveTo(
          x,
          y
        );

      } else {

        ctx.lineTo(
          x,
          y
        );
      }
    }


    ctx.closePath();


    ctx.fillStyle =
      blobFillColor(b);

    ctx.fill();


    ctx.strokeStyle =
      blobStrokeColor(b);

    ctx.lineWidth =
      Math.max(
        0.5,
        1.5 /
        cameraScale
      );

    ctx.stroke();


    ctx.restore();

  } else {


    /* ========================================================
       NORMAL BLOB
    ======================================================== */

    ctx.save();


    ctx.translate(
      b.x,
      b.y
    );


    ctx.rotate(
      b.rot
    );


    ctx.beginPath();


    for (
      let i = 0;
      i <= b.n;
      i++
    ) {

      const j =
        i % b.n;


      const a =
        j /
        b.n *
        Math.PI *
        2;


      const s =
        b.shape[j];


      const def =
        b.deformation[j];


      const x =
        Math.cos(a) *
        (b.w / 2) *
        s +
        Math.cos(a) *
        def;


      const y =
        Math.sin(a) *
        (b.h / 2) *
        s +
        Math.sin(a) *
        def;


      if (
        i === 0
      ) {

        ctx.moveTo(
          x,
          y
        );

      } else {

        ctx.lineTo(
          x,
          y
        );
      }
    }


    ctx.closePath();


    ctx.fillStyle =
      blobFillColor(b);

    ctx.fill();


    ctx.strokeStyle =
      blobStrokeColor(b);

    ctx.lineWidth =
      Math.max(
        0.5,
        1.5 /
        cameraScale
      );

    ctx.stroke();


    ctx.restore();
  }
}


/* ============================================================
   MAIN LOOP
============================================================ */

let last =
  performance.now();


function loop(now) {

  const dt =
    Math.min(
      now - last,
      32
    );


  last =
    now;


  /* ----------------------------------------------------------
     MOUSE VELOCITY
  ---------------------------------------------------------- */

  mouse.vx =
    mouse.x -
    mouse.px;


  mouse.vy =
    mouse.y -
    mouse.py;


  mouse.px =
    mouse.x;


  mouse.py =
    mouse.y;


  /* ----------------------------------------------------------
     CLEAR
  ---------------------------------------------------------- */

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  /* ----------------------------------------------------------
     CAMERA
  ---------------------------------------------------------- */

  ctx.save();


  ctx.translate(
    W / 2,
    H / 2
  );


  ctx.scale(
    cameraScale,
    cameraScale
  );


  ctx.translate(
    -W / 2,
    -H / 2
  );


  /* ----------------------------------------------------------
     UPDATE BLOBS
  ---------------------------------------------------------- */

  for (
    let index =
      blobs.length - 1;

    index >= 0;

    index--
  ) {

    const b =
      blobs[index];


    let curVx =
      b.vx;


    let curVy =
      b.vy;


    /* --------------------------------------------------------
       DRAGGING
    -------------------------------------------------------- */

    if (
      b === draggedBlob
    ) {

      const targetX =
        mouse.x -
        grabOffsetX;


      const targetY =
        mouse.y -
        grabOffsetY;


      curVx =
        targetX -
        b.x;


      curVy =
        targetY -
        b.y;


      b.x =
        targetX;


      b.y =
        targetY;

    } else {


      /* ------------------------------------------------------
         FRICTION
      ------------------------------------------------------ */

      b.vx *=
        0.98;


      b.vy *=
        0.98;


      /* ------------------------------------------------------
         MOVEMENT
      ------------------------------------------------------ */

      b.x +=
        b.vx;


      b.y +=
        b.vy;


      /* ------------------------------------------------------
         WALLS
      ------------------------------------------------------ */

      const top =
        b.h / 2;


      const bottom =
        H -
        b.h / 2;


      const left =
        b.w / 2;


      const right =
        W -
        b.w / 2;


      if (
        b.y < top
      ) {

        b.y =
          top;

        b.vy *=
          -bounce;
      }


      if (
        b.y > bottom
      ) {

        b.y =
          bottom;

        b.vy *=
          -bounce;
      }


      if (
        b.x < left
      ) {

        b.x =
          left;

        b.vx *=
          -bounce;
      }


      if (
        b.x > right
      ) {

        b.x =
          right;

        b.vx *=
          -bounce;
      }
    }


    /* --------------------------------------------------------
       DEFORMATION

       Keeps the original 45px interaction.
    -------------------------------------------------------- */

    for (
      let i = 0;
      i < b.n;
      i++
    ) {

      const a =
        (i / b.n) *
        Math.PI *
        2;


      const cosA =
        Math.cos(
          a + b.rot
        );


      const sinA =
        Math.sin(
          a + b.rot
        );


      const baseX =
        b.x +
        cosA *
        (b.w / 2);


      const baseY =
        b.y +
        sinA *
        (b.h / 2);


      const dx =
        mouse.x -
        baseX;


      const dy =
        mouse.y -
        baseY;


      const dist =
        Math.sqrt(
          dx * dx +
          dy * dy
        );


      if (
        dist <
        INTERACTION_RADIUS
      ) {

        const strength =
          1 -
          dist /
          INTERACTION_RADIUS;


        b.deformation[i] +=
          strength *
          4;
      }


      const moveImpact =
        curVx *
          cosA +
        curVy *
          sinA;


      b.deformationVelocity[i] -=
        moveImpact *
          0.12 +
        b.deformation[i] *
          0.08;


      b.deformationVelocity[i] *=
        0.85;


      b.deformation[i] +=
        b.deformationVelocity[i];
    }
  }


  /* ----------------------------------------------------------
     COLLISIONS
  ---------------------------------------------------------- */

  resolveSoftCollisions();


  /* ----------------------------------------------------------
     DRAW
  ---------------------------------------------------------- */

  for (
    let index =
      blobs.length - 1;

    index >= 0;

    index--
  ) {

    drawBlobShape(
      blobs[index],
      dt
    );
  }


  ctx.restore();


  requestAnimationFrame(
    loop
  );
}


/* ============================================================
   START
============================================================ */

resize();

requestAnimationFrame(
  loop
);
